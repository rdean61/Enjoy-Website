<div class="update-item-main">
    <div class="form-container">
        <form class="update-menu-item" (ngSubmit)="onSubmitUpdate()">
            <div class="name-container">
                <label for="namefield">Treat Name:</label>
                <input type="text" id="namefield" name="namefield" [(ngModel)]="menuItem.itemName" readonly>
            </div>
            <div class="type-container">
                <label for="typefield">Treat Type:</label>
                <select type="text" id="typefield" name="typefield" [(ngModel)]="menuItem.treatType" disabled>
                    <option value="" disabled selected hidden></option>
                    <option value="mini">Mini Cheesecake</option>
                    <option value="cupcake">Cupcake</option>
                    <option value="cookie">Cookie</option>
                    <option value="bar">Bar</option>
                    <option value="dot">Dot Cake</option>
                </select>
            </div>
            <div class="tags-container">
                <label for="tagfield">Treat Tags:</label>
                <input type="text" id="tagfield" name="tagfield" [(ngModel)]="menuItem.itemTags" required placeholder="Classic, Main, Chocolate, Fruit, Fall, Christmas, etc.">
            </div>
            <div class="submit-container">
                <button type="submit">Save Changes</button>
            </div>
        </form>
    </div>
</div>
